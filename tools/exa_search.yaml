identity:
  name: exa_search
  author: "Exa Labs"
  label:
    en_US: Exa Search
    zh_Hans: Exa 搜索
    ja_JP: Exa 検索
    pt_BR: Pesquisa Exa
description:
  human:
    en_US: Perform AI-powered search on the web using Exa to find relevant content and documents.
    zh_Hans: 使用 Exa 的 AI 搜索引擎在网络上执行搜索，查找相关内容和文档。
    ja_JP: ExaのAI検索エンジンを使用してウェブ上で検索を実行し、関連コンテンツやドキュメントを見つけます。
    pt_BR: Realize pesquisas na web com IA usando o Exa para encontrar conteúdo e documentos relevantes.
  llm: Search the web using Exa's AI-powered search engine to find relevant content, websites, and documents. Supports neural, keyword, fast, and deep search modes.
output_schema:
  type: object
  properties:
    results:
      type: array
      description: Search results
      items:
        type: object
        properties:
          title:
            type: string
          url:
            type: string
          publishedDate:
            type: string
          author:
            type: string
          score:
            type: number
          text:
            type: string
          highlights:
            type: array
            items:
              type: string
parameters:
  - name: query
    type: string
    required: true
    label:
      en_US: Search Query
      zh_Hans: 搜索查询
      ja_JP: 検索クエリ
      pt_BR: Consulta de pesquisa
    human_description:
      en_US: The search query to find relevant information on the web.
      zh_Hans: 用于在网络上查找相关信息的搜索查询。
      ja_JP: ウェブ上で関連情報を見つけるための検索クエリ。
      pt_BR: A consulta de pesquisa para encontrar informações relevantes na web.
    llm_description: The search query to find relevant information on the web.
    form: llm
  - name: search_type
    type: select
    required: false
    default: auto
    label:
      en_US: Search Type
      zh_Hans: 搜索类型
      ja_JP: 検索タイプ
      pt_BR: Tipo de pesquisa
    human_description:
      en_US: "The type of search: auto, neural (semantic), keyword (traditional), fast (low latency), or deep (comprehensive)."
      zh_Hans: 搜索类型：自动、神经（语义）、关键词（传统）、快速（低延迟）或深度（全面）。
      ja_JP: 検索タイプ：自動、ニューラル（意味的）、キーワード（従来型）、高速（低遅延）、ディープ（包括的）。
      pt_BR: "Tipo de pesquisa: auto, neural (semântica), keyword (tradicional), fast (baixa latência) ou deep (abrangente)."
    llm_description: "The type of search: auto intelligently combines methods, neural uses semantic search, keyword uses traditional search, fast prioritizes speed, deep provides comprehensive results."
    options:
      - label:
          en_US: Auto
          zh_Hans: 自动
          ja_JP: 自動
          pt_BR: Auto
        value: auto
      - label:
          en_US: Neural
          zh_Hans: 神经
          ja_JP: ニューラル
          pt_BR: Neural
        value: neural
      - label:
          en_US: Keyword
          zh_Hans: 关键词
          ja_JP: キーワード
          pt_BR: Palavra-chave
        value: keyword
      - label:
          en_US: Fast
          zh_Hans: 快速
          ja_JP: 高速
          pt_BR: Rápido
        value: fast
      - label:
          en_US: Deep
          zh_Hans: 深度
          ja_JP: ディープ
          pt_BR: Profundo
        value: deep
    form: form
  - name: num_results
    type: number
    required: false
    default: 10
    min: 1
    max: 100
    label:
      en_US: Number of Results
      zh_Hans: 结果数量
      ja_JP: 結果数
      pt_BR: Número de resultados
    human_description:
      en_US: The maximum number of search results to return (1-100).
      zh_Hans: 要返回的最大搜索结果数（1-100）。
      ja_JP: 返す検索結果の最大数（1〜100）。
      pt_BR: O número máximo de resultados de pesquisa a retornar (1-100).
    llm_description: The maximum number of search results to return, from 1 to 100.
    form: form
  - name: category
    type: select
    required: false
    label:
      en_US: Category
      zh_Hans: 类别
      ja_JP: カテゴリ
      pt_BR: Categoria
    human_description:
      en_US: Focus the search on a specific data category.
      zh_Hans: 将搜索集中在特定数据类别上。
      ja_JP: 特定のデータカテゴリに検索を集中させます。
      pt_BR: Concentre a pesquisa em uma categoria de dados específica.
    llm_description: Focus the search on a specific data category.
    options:
      - label:
          en_US: Company
          zh_Hans: 公司
          ja_JP: 会社
          pt_BR: Empresa
        value: company
      - label:
          en_US: Research Paper
          zh_Hans: 研究论文
          ja_JP: 研究論文
          pt_BR: Artigo de Pesquisa
        value: research paper
      - label:
          en_US: News
          zh_Hans: 新闻
          ja_JP: ニュース
          pt_BR: Notícias
        value: news
      - label:
          en_US: PDF
          zh_Hans: PDF
          ja_JP: PDF
          pt_BR: PDF
        value: pdf
      - label:
          en_US: GitHub
          zh_Hans: GitHub
          ja_JP: GitHub
          pt_BR: GitHub
        value: github
      - label:
          en_US: Tweet
          zh_Hans: 推文
          ja_JP: ツイート
          pt_BR: Tweet
        value: tweet
      - label:
          en_US: Personal Site
          zh_Hans: 个人网站
          ja_JP: 個人サイト
          pt_BR: Site Pessoal
        value: personal site
      - label:
          en_US: LinkedIn Profile
          zh_Hans: LinkedIn 主页
          ja_JP: LinkedInプロフィール
          pt_BR: Perfil LinkedIn
        value: linkedin profile
      - label:
          en_US: Financial Report
          zh_Hans: 财务报告
          ja_JP: 財務報告
          pt_BR: Relatório Financeiro
        value: financial report
    form: form
  - name: include_domains
    type: string
    required: false
    label:
      en_US: Include Domains
      zh_Hans: 包含域名
      ja_JP: 含めるドメイン
      pt_BR: Incluir domínios
    human_description:
      en_US: Comma-separated list of domains to include in results.
      zh_Hans: 要在结果中包含的域名，用逗号分隔。
      ja_JP: 結果に含めるドメインのカンマ区切りリスト。
      pt_BR: Lista de domínios separados por vírgulas para incluir nos resultados.
    llm_description: Comma-separated list of domains to restrict search results to.
    form: llm
  - name: exclude_domains
    type: string
    required: false
    label:
      en_US: Exclude Domains
      zh_Hans: 排除域名
      ja_JP: 除外するドメイン
      pt_BR: Excluir domínios
    human_description:
      en_US: Comma-separated list of domains to exclude from results.
      zh_Hans: 要从结果中排除的域名，用逗号分隔。
      ja_JP: 結果から除外するドメインのカンマ区切りリスト。
      pt_BR: Lista de domínios separados por vírgulas para excluir dos resultados.
    llm_description: Comma-separated list of domains to exclude from search results.
    form: llm
  - name: start_published_date
    type: string
    required: false
    label:
      en_US: Start Published Date
      zh_Hans: 开始发布日期
      ja_JP: 公開開始日
      pt_BR: Data de publicação inicial
    human_description:
      en_US: Only include results published after this date (YYYY-MM-DD).
      zh_Hans: 仅包含在此日期之后发布的结果（YYYY-MM-DD）。
      ja_JP: この日付以降に公開された結果のみ含める（YYYY-MM-DD）。
      pt_BR: Incluir apenas resultados publicados após esta data (AAAA-MM-DD).
    llm_description: Only include results published after this date in YYYY-MM-DD format.
    form: llm
  - name: end_published_date
    type: string
    required: false
    label:
      en_US: End Published Date
      zh_Hans: 结束发布日期
      ja_JP: 公開終了日
      pt_BR: Data de publicação final
    human_description:
      en_US: Only include results published before this date (YYYY-MM-DD).
      zh_Hans: 仅包含在此日期之前发布的结果（YYYY-MM-DD）。
      ja_JP: この日付以前に公開された結果のみ含める（YYYY-MM-DD）。
      pt_BR: Incluir apenas resultados publicados antes desta data (AAAA-MM-DD).
    llm_description: Only include results published before this date in YYYY-MM-DD format.
    form: llm
  - name: use_autoprompt
    type: boolean
    required: false
    default: true
    label:
      en_US: Use Autoprompt
      zh_Hans: 使用自动提示
      ja_JP: 自動プロンプトを使用
      pt_BR: Usar Autoprompt
    human_description:
      en_US: Whether to use Exa's prompt engineering to improve the query.
      zh_Hans: 是否使用 Exa 的提示工程来改进查询。
      ja_JP: Exaのプロンプトエンジニアリングを使用してクエリを改善するかどうか。
      pt_BR: Se deve usar a engenharia de prompt da Exa para melhorar a consulta.
    llm_description: When true, Exa will automatically rewrite the query to improve search results.
    form: form
  - name: text_contents
    type: boolean
    required: false
    default: false
    label:
      en_US: Include Text Contents
      zh_Hans: 包含文本内容
      ja_JP: テキスト内容を含める
      pt_BR: Incluir conteúdo de texto
    human_description:
      en_US: Whether to include the text contents from each search result.
      zh_Hans: 是否包含每个搜索结果的文本内容。
      ja_JP: 各検索結果のテキスト内容を含めるかどうか。
      pt_BR: Se deve incluir o conteúdo de texto de cada resultado.
    llm_description: When true, the response will include the text content of each webpage.
    form: form
  - name: highlights
    type: boolean
    required: false
    default: false
    label:
      en_US: Highlights
      zh_Hans: 高亮
      ja_JP: ハイライト
      pt_BR: Destaques
    human_description:
      en_US: Whether to include highlighted relevant text snippets.
      zh_Hans: 是否包含高亮的相关文本片段。
      ja_JP: 関連するテキストのハイライトを含めるかどうか。
      pt_BR: Se deve incluir trechos de texto relevantes destacados.
    llm_description: When true, relevant sections of text will be highlighted in the results.
    form: form
  - name: summary
    type: boolean
    required: false
    default: false
    label:
      en_US: Summary
      zh_Hans: 摘要
      ja_JP: 要約
      pt_BR: Resumo
    human_description:
      en_US: Whether to include an AI-generated summary of each result.
      zh_Hans: 是否包含每个结果的 AI 生成摘要。
      ja_JP: 各結果のAI生成要約を含めるかどうか。
      pt_BR: Se deve incluir um resumo gerado por IA de cada resultado.
    llm_description: When true, an AI-generated summary of each result will be included.
    form: form
  - name: livecrawl
    type: select
    required: false
    label:
      en_US: Live Crawl
      zh_Hans: 实时爬取
      ja_JP: ライブクロール
      pt_BR: Crawl ao Vivo
    human_description:
      en_US: Control live crawling behavior for fresher content.
      zh_Hans: 控制实时爬取行为以获取更新鲜的内容。
      ja_JP: より新鮮なコンテンツのためのライブクロール動作を制御します。
      pt_BR: Controle o comportamento de crawl ao vivo para conteúdo mais recente.
    llm_description: Control live crawling behavior for content freshness.
    options:
      - label:
          en_US: Never
          zh_Hans: 从不
          ja_JP: なし
          pt_BR: Nunca
        value: never
      - label:
          en_US: Fallback
          zh_Hans: 回退
          ja_JP: フォールバック
          pt_BR: Fallback
        value: fallback
      - label:
          en_US: Always
          zh_Hans: 总是
          ja_JP: 常に
          pt_BR: Sempre
        value: always
      - label:
          en_US: Auto
          zh_Hans: 自动
          ja_JP: 自動
          pt_BR: Auto
        value: auto
    form: form
  - name: include_text
    type: string
    required: false
    label:
      en_US: Include Text Filter
      zh_Hans: 包含文本过滤
      ja_JP: テキスト包含フィルター
      pt_BR: Filtro de inclusão de texto
    human_description:
      en_US: A string that must appear in the webpage text of results (up to 5 words).
      zh_Hans: 必须出现在结果网页文本中的字符串（最多5个单词）。
      ja_JP: 結果のウェブページテキストに含まれなければならない文字列（最大5語）。
      pt_BR: Uma string que deve aparecer no texto da página dos resultados (até 5 palavras).
    llm_description: A string that must be present in the webpage text of results. Up to 5 words.
    form: llm
  - name: exclude_text
    type: string
    required: false
    label:
      en_US: Exclude Text Filter
      zh_Hans: 排除文本过滤
      ja_JP: テキスト除外フィルター
      pt_BR: Filtro de exclusão de texto
    human_description:
      en_US: A string that must not appear in the webpage text of results (up to 5 words).
      zh_Hans: 不能出现在结果网页文本中的字符串（最多5个单词）。
      ja_JP: 結果のウェブページテキストに含まれてはならない文字列（最大5語）。
      pt_BR: Uma string que não deve aparecer no texto da página dos resultados (até 5 palavras).
    llm_description: A string that must not be present in the webpage text of results. Up to 5 words.
    form: llm
  - name: subpages
    type: number
    required: false
    label:
      en_US: Subpages
      zh_Hans: 子页面数
      ja_JP: サブページ数
      pt_BR: Subpáginas
    human_description:
      en_US: Number of subpages to crawl for each result.
      zh_Hans: 每个结果要爬取的子页面数量。
      ja_JP: 各結果についてクロールするサブページの数。
      pt_BR: Número de subpáginas a rastrear para cada resultado.
    llm_description: Number of subpages to crawl for each result.
    form: form
extra:
  python:
    source: tools/exa_search.py
