identity:
  name: exa_search
  author: "Exa Labs"
  label:
    en_US: Exa Search
    zh_Hans: Exa 搜索
    ja_JP: Exa 検索
    pt_BR: Pesquisa Exa
description:
  human:
    en_US: Perform AI-powered search on the web using Exa to find relevant content and documents.
    zh_Hans: 使用 Exa AI 搜索网页，查找相关内容和文档。
    ja_JP: ExaのAI検索エンジンを使用してウェブ上で検索を実行し、関連コンテンツやドキュメントを見つけます。
    pt_BR: Realize pesquisas na web com IA usando o Exa para encontrar conteúdo e documentos relevantes.
  llm: Search the web using Exa's AI-powered search engine to find relevant content, websites, and documents. Supports neural, keyword, fast, and deep search modes. Use the category filter for specialized searches like company or people search.
output_schema:
  type: object
  properties:
    results:
      type: array
      description: Search results
      items:
        type: object
        properties:
          title:
            type: string
          url:
            type: string
          publishedDate:
            type: string
          author:
            type: string
          score:
            type: number
          text:
            type: string
          highlights:
            type: array
            items:
              type: string
parameters:
  - name: query
    type: string
    required: true
    label:
      en_US: Search Query
      zh_Hans: 搜索查询
      ja_JP: 検索クエリ
      pt_BR: Consulta de pesquisa
    human_description:
      en_US: The search query to find relevant information on the web.
      zh_Hans: 要搜索的内容。
      ja_JP: ウェブ上で関連情報を見つけるための検索クエリ。
      pt_BR: A consulta de pesquisa para encontrar informações relevantes na web.
    llm_description: The search query to find relevant information on the web.
    form: llm
  - name: search_type
    type: select
    required: false
    default: auto
    label:
      en_US: Search Type
      zh_Hans: 搜索类型
      ja_JP: 検索タイプ
      pt_BR: Tipo de pesquisa
    human_description:
      en_US: "The type of search: auto (recommended, combines methods), neural (semantic), fast (low latency), or deep (comprehensive with query expansion)."
      zh_Hans: "搜索类型：自动（推荐，智能组合多种方式）、语义（基于语义理解）、快速（低延迟）或深度（扩展查询，全面搜索）。"
      ja_JP: 検索タイプ：自動（推奨、手法を組み合わせ）、ニューラル（意味的）、高速（低遅延）、ディープ（クエリ拡張による包括的検索）。
      pt_BR: "Tipo de pesquisa: auto (recomendado, combina métodos), neural (semântica), fast (baixa latência) ou deep (abrangente com expansão de consulta)."
    llm_description: "The type of search: auto (default, intelligently combines methods), neural (semantic/embeddings-based), fast (lowest latency), deep (comprehensive with query expansion and detailed context)."
    options:
      - label:
          en_US: Auto
          zh_Hans: 自动
          ja_JP: 自動
          pt_BR: Auto
        value: auto
      - label:
          en_US: Neural
          zh_Hans: 语义
          ja_JP: ニューラル
          pt_BR: Neural
        value: neural
      - label:
          en_US: Fast
          zh_Hans: 快速
          ja_JP: 高速
          pt_BR: Rápido
        value: fast
      - label:
          en_US: Deep
          zh_Hans: 深度
          ja_JP: ディープ
          pt_BR: Profundo
        value: deep
    form: form
  - name: num_results
    type: number
    required: false
    default: 10
    min: 1
    max: 100
    label:
      en_US: Number of Results
      zh_Hans: 结果数量
      ja_JP: 結果数
      pt_BR: Número de resultados
    human_description:
      en_US: The maximum number of search results to return (1-100).
      zh_Hans: 要返回的最大搜索结果数（1-100）。
      ja_JP: 返す検索結果の最大数（1〜100）。
      pt_BR: O número máximo de resultados de pesquisa a retornar (1-100).
    llm_description: The maximum number of search results to return, from 1 to 100.
    form: form
  - name: category
    type: select
    required: false
    label:
      en_US: Category
      zh_Hans: 类别
      ja_JP: カテゴリ
      pt_BR: Categoria
    human_description:
      en_US: Focus the search on a specific data category.
      zh_Hans: 限定搜索的数据类别。
      ja_JP: 特定のデータカテゴリに検索を集中させます。
      pt_BR: Concentre a pesquisa em uma categoria de dados específica.
    llm_description: Focus the search on a specific data category.
    options:
      - label:
          en_US: Company
          zh_Hans: 公司
          ja_JP: 会社
          pt_BR: Empresa
        value: company
      - label:
          en_US: Research Paper
          zh_Hans: 研究论文
          ja_JP: 研究論文
          pt_BR: Artigo de Pesquisa
        value: research paper
      - label:
          en_US: News
          zh_Hans: 新闻
          ja_JP: ニュース
          pt_BR: Notícias
        value: news
      - label:
          en_US: Tweet
          zh_Hans: 推文
          ja_JP: ツイート
          pt_BR: Tweet
        value: tweet
      - label:
          en_US: Personal Site
          zh_Hans: 个人网站
          ja_JP: 個人サイト
          pt_BR: Site Pessoal
        value: personal site
      - label:
          en_US: Financial Report
          zh_Hans: 财务报告
          ja_JP: 財務報告
          pt_BR: Relatório Financeiro
        value: financial report
      - label:
          en_US: People
          zh_Hans: 人物
          ja_JP: 人物
          pt_BR: Pessoas
        value: people
    form: form
  - name: include_domains
    type: string
    required: false
    label:
      en_US: Include Domains
      zh_Hans: 包含域名
      ja_JP: 含めるドメイン
      pt_BR: Incluir domínios
    human_description:
      en_US: Comma-separated list of domains to include in results.
      zh_Hans: 要在结果中包含的域名，用逗号分隔。
      ja_JP: 結果に含めるドメインのカンマ区切りリスト。
      pt_BR: Lista de domínios separados por vírgulas para incluir nos resultados.
    llm_description: Comma-separated list of domains to restrict search results to.
    form: llm
  - name: exclude_domains
    type: string
    required: false
    label:
      en_US: Exclude Domains
      zh_Hans: 排除域名
      ja_JP: 除外するドメイン
      pt_BR: Excluir domínios
    human_description:
      en_US: Comma-separated list of domains to exclude from results.
      zh_Hans: 要从结果中排除的域名，用逗号分隔。
      ja_JP: 結果から除外するドメインのカンマ区切りリスト。
      pt_BR: Lista de domínios separados por vírgulas para excluir dos resultados.
    llm_description: Comma-separated list of domains to exclude from search results.
    form: llm
  - name: start_published_date
    type: string
    required: false
    label:
      en_US: Start Published Date
      zh_Hans: 开始发布日期
      ja_JP: 公開開始日
      pt_BR: Data de publicação inicial
    human_description:
      en_US: Only include results published after this date (ISO 8601, e.g. 2025-01-01T00:00:00.000Z).
      zh_Hans: 仅包含在此日期之后发布的结果（ISO 8601 格式，如 2025-01-01T00:00:00.000Z）。
      ja_JP: この日付以降に公開された結果のみ含める（ISO 8601形式、例：2025-01-01T00:00:00.000Z）。
      pt_BR: Incluir apenas resultados publicados após esta data (ISO 8601, ex. 2025-01-01T00:00:00.000Z).
    llm_description: Only include results published after this date in ISO 8601 format (e.g. 2025-01-01T00:00:00.000Z).
    form: llm
  - name: end_published_date
    type: string
    required: false
    label:
      en_US: End Published Date
      zh_Hans: 结束发布日期
      ja_JP: 公開終了日
      pt_BR: Data de publicação final
    human_description:
      en_US: Only include results published before this date (ISO 8601, e.g. 2025-12-31T00:00:00.000Z).
      zh_Hans: 仅包含在此日期之前发布的结果（ISO 8601 格式，如 2025-12-31T00:00:00.000Z）。
      ja_JP: この日付以前に公開された結果のみ含める（ISO 8601形式、例：2025-12-31T00:00:00.000Z）。
      pt_BR: Incluir apenas resultados publicados antes desta data (ISO 8601, ex. 2025-12-31T00:00:00.000Z).
    llm_description: Only include results published before this date in ISO 8601 format (e.g. 2025-12-31T00:00:00.000Z).
    form: llm
  - name: use_autoprompt
    type: boolean
    required: false
    default: true
    label:
      en_US: Use Autoprompt
      zh_Hans: 使用自动提示
      ja_JP: 自動プロンプトを使用
      pt_BR: Usar Autoprompt
    human_description:
      en_US: Whether to use Exa's prompt engineering to improve the query.
      zh_Hans: 是否让 Exa 自动优化搜索词以提升结果质量。
      ja_JP: Exaのプロンプトエンジニアリングを使用してクエリを改善するかどうか。
      pt_BR: Se deve usar a engenharia de prompt da Exa para melhorar a consulta.
    llm_description: When true, Exa will automatically rewrite the query to improve search results.
    form: form
  - name: text_contents
    type: boolean
    required: false
    default: false
    label:
      en_US: Include Text Contents
      zh_Hans: 包含文本内容
      ja_JP: テキスト内容を含める
      pt_BR: Incluir conteúdo de texto
    human_description:
      en_US: Whether to include the text contents from each search result.
      zh_Hans: 是否包含每个搜索结果的文本内容。
      ja_JP: 各検索結果のテキスト内容を含めるかどうか。
      pt_BR: Se deve incluir o conteúdo de texto de cada resultado.
    llm_description: When true, the response will include the text content of each webpage.
    form: form
  - name: highlights
    type: boolean
    required: false
    default: false
    label:
      en_US: Highlights
      zh_Hans: 关键片段
      ja_JP: ハイライト
      pt_BR: Destaques
    human_description:
      en_US: Whether to include highlighted relevant text snippets.
      zh_Hans: 是否返回与查询相关的关键文本片段。
      ja_JP: 関連するテキストのハイライトを含めるかどうか。
      pt_BR: Se deve incluir trechos de texto relevantes destacados.
    llm_description: When true, relevant sections of text will be highlighted in the results.
    form: form
  - name: summary
    type: boolean
    required: false
    default: false
    label:
      en_US: Summary
      zh_Hans: 摘要
      ja_JP: 要約
      pt_BR: Resumo
    human_description:
      en_US: Whether to include an AI-generated summary of each result.
      zh_Hans: 是否包含每个结果的 AI 生成摘要。
      ja_JP: 各結果のAI生成要約を含めるかどうか。
      pt_BR: Se deve incluir um resumo gerado por IA de cada resultado.
    llm_description: When true, an AI-generated summary of each result will be included.
    form: form
  - name: max_age_hours
    type: number
    required: false
    label:
      en_US: Max Cache Age (hours)
      zh_Hans: 最大缓存时长（小时）
      ja_JP: 最大キャッシュ時間（時間）
      pt_BR: Idade máxima do cache (horas)
    human_description:
      en_US: "Controls livecrawl behavior: 0 = always livecrawl, -1 = never livecrawl, positive number = use cache if fresher than this many hours. Omit for default (fallback to livecrawl only if no cache)."
      zh_Hans: "控制实时爬取行为：0 = 始终实时爬取，-1 = 从不实时爬取，正数 = 如果缓存在此小时数内则使用缓存。不填则使用默认行为。"
      ja_JP: "ライブクロール動作を制御：0 = 常にライブクロール、-1 = ライブクロールしない、正の数 = 指定時間内のキャッシュがあれば使用。省略でデフォルト動作。"
      pt_BR: "Controla o comportamento de livecrawl: 0 = sempre livecrawl, -1 = nunca livecrawl, número positivo = usar cache se mais recente que estas horas. Omita para padrão."
    llm_description: "Controls livecrawl behavior. 0 = always livecrawl (freshest but slower), -1 = never livecrawl (cached only), positive integer = use cache if fresher than this many hours. Omit for default fallback behavior."
    form: form
  - name: include_text
    type: string
    required: false
    label:
      en_US: Include Text Filter
      zh_Hans: 必含关键词
      ja_JP: テキスト包含フィルター
      pt_BR: Filtro de inclusão de texto
    human_description:
      en_US: A string that must appear in the webpage text of results (up to 5 words).
      zh_Hans: 结果页面中必须包含的文本（最多 5 个词）。
      ja_JP: 結果のウェブページテキストに含まれなければならない文字列（最大5語）。
      pt_BR: Uma string que deve aparecer no texto da página dos resultados (até 5 palavras).
    llm_description: A string that must be present in the webpage text of results. Up to 5 words.
    form: llm
  - name: exclude_text
    type: string
    required: false
    label:
      en_US: Exclude Text Filter
      zh_Hans: 排除关键词
      ja_JP: テキスト除外フィルター
      pt_BR: Filtro de exclusão de texto
    human_description:
      en_US: A string that must not appear in the webpage text of results (up to 5 words).
      zh_Hans: 结果页面中不能出现的文本（最多 5 个词）。
      ja_JP: 結果のウェブページテキストに含まれてはならない文字列（最大5語）。
      pt_BR: Uma string que não deve aparecer no texto da página dos resultados (até 5 palavras).
    llm_description: A string that must not be present in the webpage text of results. Up to 5 words.
    form: llm
  - name: subpages
    type: number
    required: false
    label:
      en_US: Subpages
      zh_Hans: 子页面数
      ja_JP: サブページ数
      pt_BR: Subpáginas
    human_description:
      en_US: Number of subpages to crawl for each result.
      zh_Hans: 每个结果要爬取的子页面数量。
      ja_JP: 各結果についてクロールするサブページの数。
      pt_BR: Número de subpáginas a rastrear para cada resultado.
    llm_description: Number of subpages to crawl for each result.
    form: form
extra:
  python:
    source: tools/exa_search.py
