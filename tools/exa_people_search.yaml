identity:
  name: exa_people_search
  author: "Exa Labs"
  label:
    en_US: Exa People Search
    zh_Hans: Exa 人物搜索
    ja_JP: Exa 人物検索
    pt_BR: Pesquisa de Pessoas Exa
description:
  human:
    en_US: Search for people using Exa's people search with 1B+ indexed profiles for sales, recruiting, and research.
    zh_Hans: 使用 Exa 的人物搜索功能搜索人物，拥有超过10亿个索引档案，适用于销售、招聘和研究。
    ja_JP: 10億以上のインデックスプロファイルを持つExaの人物検索で、営業、採用、リサーチに活用できます。
    pt_BR: Pesquise pessoas usando a busca de pessoas da Exa com mais de 1B perfis indexados para vendas, recrutamento e pesquisa.
  llm: Search for people using Exa's specialized people search with 1B+ indexed profiles. Supports role-based search, skill-based discovery, and individual lookup. Great for sales, recruiting, and research.
output_schema:
  type: object
  properties:
    results:
      type: array
      description: People search results
      items:
        type: object
        properties:
          title:
            type: string
          url:
            type: string
          score:
            type: number
          text:
            type: string
parameters:
  - name: query
    type: string
    required: true
    label:
      en_US: Search Query
      zh_Hans: 搜索查询
      ja_JP: 検索クエリ
      pt_BR: Consulta de pesquisa
    human_description:
      en_US: "Describe the person or type of person you're looking for (e.g. 'VP of Product at Microsoft', 'machine learning engineers in NYC')."
      zh_Hans: 描述您要查找的人物或人物类型（例如"微软的产品副总裁"、"纽约的机器学习工程师"）。
      ja_JP: 探している人物や人物タイプを記述してください（例：「Microsoftのプロダクト担当VP」、「NYCの機械学習エンジニア」）。
      pt_BR: "Descreva a pessoa ou tipo de pessoa que procura (ex: 'VP de Produto na Microsoft', 'engenheiros de ML em São Paulo')."
    llm_description: Describe the person or type of person to search for. Supports role-based search, skill-based discovery, and individual lookup.
    form: llm
  - name: num_results
    type: number
    required: false
    default: 10
    min: 1
    max: 100
    label:
      en_US: Number of Results
      zh_Hans: 结果数量
      ja_JP: 結果数
      pt_BR: Número de resultados
    human_description:
      en_US: The maximum number of results to return (1-100).
      zh_Hans: 要返回的最大结果数（1-100）。
      ja_JP: 返す結果の最大数（1〜100）。
      pt_BR: O número máximo de resultados a retornar (1-100).
    llm_description: The maximum number of people results to return, from 1 to 100.
    form: form
  - name: include_domains
    type: string
    required: false
    label:
      en_US: Include Domains
      zh_Hans: 包含域名
      ja_JP: 含めるドメイン
      pt_BR: Incluir domínios
    human_description:
      en_US: Comma-separated list of domains to include (only LinkedIn domains supported for people search).
      zh_Hans: 要包含的域名列表，用逗号分隔（人物搜索仅支持 LinkedIn 域名）。
      ja_JP: 含めるドメインのカンマ区切りリスト（人物検索ではLinkedInドメインのみサポート）。
      pt_BR: Lista de domínios separados por vírgulas para incluir (apenas domínios LinkedIn suportados para pesquisa de pessoas).
    llm_description: Comma-separated domains to restrict results to. Note that people search only supports LinkedIn domains.
    form: llm
  - name: text_contents
    type: boolean
    required: false
    default: false
    label:
      en_US: Include Text Contents
      zh_Hans: 包含文本内容
      ja_JP: テキスト内容を含める
      pt_BR: Incluir conteúdo de texto
    human_description:
      en_US: Whether to include the text contents from each result.
      zh_Hans: 是否包含每个结果的文本内容。
      ja_JP: 各結果のテキスト内容を含めるかどうか。
      pt_BR: Se deve incluir o conteúdo de texto de cada resultado.
    llm_description: When true, the response will include the text content of each person's profile page.
    form: form
  - name: highlights
    type: boolean
    required: false
    default: false
    label:
      en_US: Highlights
      zh_Hans: 高亮
      ja_JP: ハイライト
      pt_BR: Destaques
    human_description:
      en_US: Whether to include highlighted relevant text snippets.
      zh_Hans: 是否包含高亮的相关文本片段。
      ja_JP: 関連するテキストのハイライトを含めるかどうか。
      pt_BR: Se deve incluir trechos de texto relevantes destacados.
    llm_description: When true, relevant sections of text will be highlighted in the results.
    form: form
  - name: summary
    type: boolean
    required: false
    default: false
    label:
      en_US: Summary
      zh_Hans: 摘要
      ja_JP: 要約
      pt_BR: Resumo
    human_description:
      en_US: Whether to include an AI-generated summary of each result.
      zh_Hans: 是否包含每个结果的 AI 生成摘要。
      ja_JP: 各結果のAI生成要約を含めるかどうか。
      pt_BR: Se deve incluir um resumo gerado por IA de cada resultado.
    llm_description: When true, an AI-generated summary of each person result will be included.
    form: form
  - name: livecrawl
    type: select
    required: false
    label:
      en_US: Live Crawl
      zh_Hans: 实时爬取
      ja_JP: ライブクロール
      pt_BR: Crawl ao Vivo
    human_description:
      en_US: Control live crawling behavior for fresher content.
      zh_Hans: 控制实时爬取行为以获取更新鲜的内容。
      ja_JP: より新鮮なコンテンツのためのライブクロール動作を制御します。
      pt_BR: Controle o comportamento de crawl ao vivo para conteúdo mais recente.
    llm_description: Control live crawling behavior for content freshness.
    options:
      - label:
          en_US: Never
          zh_Hans: 从不
          ja_JP: なし
          pt_BR: Nunca
        value: never
      - label:
          en_US: Fallback
          zh_Hans: 回退
          ja_JP: フォールバック
          pt_BR: Fallback
        value: fallback
      - label:
          en_US: Always
          zh_Hans: 总是
          ja_JP: 常に
          pt_BR: Sempre
        value: always
      - label:
          en_US: Auto
          zh_Hans: 自动
          ja_JP: 自動
          pt_BR: Auto
        value: auto
    form: form
extra:
  python:
    source: tools/exa_people_search.py
