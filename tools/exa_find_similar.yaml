identity:
  name: exa_find_similar
  author: "Exa Labs"
  label:
    en_US: Exa Find Similar
    zh_Hans: Exa 查找相似
    ja_JP: Exa 類似検索
    pt_BR: Exa Encontrar Similares
description:
  human:
    en_US: Find web pages with similar content to a given URL using Exa's similarity search.
    zh_Hans: 使用 Exa 的相似性搜索查找与给定 URL 内容相似的网页。
    ja_JP: Exaの類似性検索を使用して、指定されたURLと類似したコンテンツのウェブページを見つけます。
    pt_BR: Encontre páginas web com conteúdo similar a uma URL usando a busca por similaridade da Exa.
  llm: Find web pages with similar content to a given URL using Exa's content similarity search.
parameters:
  - name: url
    type: string
    required: true
    label:
      en_US: URL
      zh_Hans: URL
      ja_JP: URL
      pt_BR: URL
    human_description:
      en_US: The URL to find similar pages for.
      zh_Hans: 要查找相似页面的 URL。
      ja_JP: 類似ページを検索するURL。
      pt_BR: A URL para encontrar páginas similares.
    llm_description: The source URL to find similar content for.
    form: llm
  - name: num_results
    type: number
    required: false
    default: 10
    min: 1
    max: 100
    label:
      en_US: Number of Results
      zh_Hans: 结果数量
      ja_JP: 結果数
      pt_BR: Número de resultados
    human_description:
      en_US: Number of similar pages to return (1-100).
      zh_Hans: 返回的相似页面数量（1-100）。
      ja_JP: 返す類似ページの数（1〜100）。
      pt_BR: Número de páginas similares a retornar (1-100).
    llm_description: Number of similar pages to return, from 1 to 100.
    form: form
  - name: text
    type: boolean
    required: false
    default: false
    label:
      en_US: Include Text
      zh_Hans: 包含文本
      ja_JP: テキストを含む
      pt_BR: Incluir Texto
    human_description:
      en_US: Whether to include full text of the results.
      zh_Hans: 是否包含结果的完整文本。
      ja_JP: 結果の全文を含めるかどうか。
      pt_BR: Se deve incluir o texto completo dos resultados.
    llm_description: Include the full text content of each similar page.
    form: form
  - name: highlights
    type: boolean
    required: false
    default: false
    label:
      en_US: Highlights
      zh_Hans: 高亮
      ja_JP: ハイライト
      pt_BR: Destaques
    human_description:
      en_US: Whether to include highlighted text snippets.
      zh_Hans: 是否包含高亮文本片段。
      ja_JP: ハイライトテキストを含めるかどうか。
      pt_BR: Se deve incluir trechos de texto destacados.
    llm_description: Include highlighted relevant text snippets from each similar page.
    form: form
  - name: summary
    type: boolean
    required: false
    default: false
    label:
      en_US: Summary
      zh_Hans: 摘要
      ja_JP: 要約
      pt_BR: Resumo
    human_description:
      en_US: Whether to include an AI-generated summary.
      zh_Hans: 是否包含 AI 生成的摘要。
      ja_JP: AI生成の要約を含めるかどうか。
      pt_BR: Se deve incluir um resumo gerado por IA.
    llm_description: Include an AI-generated summary of each similar page.
    form: form
  - name: include_domains
    type: string
    required: false
    label:
      en_US: Include Domains
      zh_Hans: 包含域名
      ja_JP: 含めるドメイン
      pt_BR: Incluir domínios
    human_description:
      en_US: Comma-separated list of domains to include in results.
      zh_Hans: 要在结果中包含的域名，用逗号分隔。
      ja_JP: 結果に含めるドメインのカンマ区切りリスト。
      pt_BR: Lista de domínios separados por vírgulas para incluir nos resultados.
    llm_description: Comma-separated list of domains to restrict results to.
    form: llm
  - name: exclude_domains
    type: string
    required: false
    label:
      en_US: Exclude Domains
      zh_Hans: 排除域名
      ja_JP: 除外するドメイン
      pt_BR: Excluir domínios
    human_description:
      en_US: Comma-separated list of domains to exclude from results.
      zh_Hans: 要从结果中排除的域名，用逗号分隔。
      ja_JP: 結果から除外するドメインのカンマ区切りリスト。
      pt_BR: Lista de domínios separados por vírgulas para excluir dos resultados.
    llm_description: Comma-separated list of domains to exclude from results.
    form: llm
  - name: start_published_date
    type: string
    required: false
    label:
      en_US: Start Published Date
      zh_Hans: 开始发布日期
      ja_JP: 公開開始日
      pt_BR: Data de publicação inicial
    human_description:
      en_US: Only include results published after this date (YYYY-MM-DD).
      zh_Hans: 仅包含在此日期之后发布的结果（YYYY-MM-DD）。
      ja_JP: この日付以降に公開された結果のみ（YYYY-MM-DD）。
      pt_BR: Incluir apenas resultados publicados após esta data (AAAA-MM-DD).
    llm_description: Only include results published after this date in YYYY-MM-DD format.
    form: llm
  - name: end_published_date
    type: string
    required: false
    label:
      en_US: End Published Date
      zh_Hans: 结束发布日期
      ja_JP: 公開終了日
      pt_BR: Data de publicação final
    human_description:
      en_US: Only include results published before this date (YYYY-MM-DD).
      zh_Hans: 仅包含在此日期之前发布的结果（YYYY-MM-DD）。
      ja_JP: この日付以前に公開された結果のみ（YYYY-MM-DD）。
      pt_BR: Incluir apenas resultados publicados antes desta data (AAAA-MM-DD).
    llm_description: Only include results published before this date in YYYY-MM-DD format.
    form: llm
  - name: include_text
    type: string
    required: false
    label:
      en_US: Include Text Filter
      zh_Hans: 包含文本过滤
      ja_JP: テキスト包含フィルター
      pt_BR: Filtro de inclusão de texto
    human_description:
      en_US: A string that must appear in the webpage text of results (up to 5 words).
      zh_Hans: 必须出现在结果网页文本中的字符串（最多5个单词）。
      ja_JP: 結果のウェブページテキストに含まれなければならない文字列（最大5語）。
      pt_BR: Uma string que deve aparecer no texto da página dos resultados (até 5 palavras).
    llm_description: A string that must be present in the text of results. Up to 5 words.
    form: llm
  - name: exclude_text
    type: string
    required: false
    label:
      en_US: Exclude Text Filter
      zh_Hans: 排除文本过滤
      ja_JP: テキスト除外フィルター
      pt_BR: Filtro de exclusão de texto
    human_description:
      en_US: A string that must not appear in the webpage text of results (up to 5 words).
      zh_Hans: 不能出现在结果网页文本中的字符串（最多5个单词）。
      ja_JP: 結果のウェブページテキストに含まれてはならない文字列（最大5語）。
      pt_BR: Uma string que não deve aparecer no texto da página dos resultados (até 5 palavras).
    llm_description: A string that must not be present in the text of results. Up to 5 words.
    form: llm
  - name: category
    type: select
    required: false
    label:
      en_US: Category
      zh_Hans: 类别
      ja_JP: カテゴリ
      pt_BR: Categoria
    human_description:
      en_US: Focus on a specific content category.
      zh_Hans: 集中在特定内容类别。
      ja_JP: 特定のコンテンツカテゴリに集中します。
      pt_BR: Concentre-se em uma categoria de conteúdo específica.
    llm_description: Focus the similarity search on a specific content category.
    options:
      - label:
          en_US: Company
          zh_Hans: 公司
          ja_JP: 会社
          pt_BR: Empresa
        value: company
      - label:
          en_US: Research Paper
          zh_Hans: 研究论文
          ja_JP: 研究論文
          pt_BR: Artigo de Pesquisa
        value: research paper
      - label:
          en_US: News
          zh_Hans: 新闻
          ja_JP: ニュース
          pt_BR: Notícias
        value: news
      - label:
          en_US: PDF
          zh_Hans: PDF
          ja_JP: PDF
          pt_BR: PDF
        value: pdf
      - label:
          en_US: GitHub
          zh_Hans: GitHub
          ja_JP: GitHub
          pt_BR: GitHub
        value: github
      - label:
          en_US: Tweet
          zh_Hans: 推文
          ja_JP: ツイート
          pt_BR: Tweet
        value: tweet
    form: form
extra:
  python:
    source: tools/exa_find_similar.py
